name: erebrus_ai
description: "Erebrus AI — local LLM runner. Download models, chat on-device, and serve them to your network."
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_symbols_icons: ^4.2815.1
  flutter_secure_storage: ^10.3.1
  reown_appkit: ^1.4.3+1
  solana_mobile_client: ^0.1.2
  device_info_plus: ^12.4.0
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  shared_preferences: ^2.3.3
  get: ^4.7.3
  system_info2: ^4.1.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  wakelock_plus: ^1.2.10
  flutter_foreground_task: ^8.1.0
  shelf: ^1.4.2
  multicast_dns: ^0.3.2+7
  http: ^1.2.2
  uuid: ^4.5.1
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  bonsoir: ^7.1.4
  lib_llama_cpp: ^0.7.3
  lib_llama_cpp_platform_interface: ^0.7.3
  share_plus: ^12.0.2
  flutter_tts: ^4.2.5
  file_picker: ^11.0.2
  macos_secure_bookmarks: ^0.2.1
  erebrus_mlx:
    path: packages/erebrus_mlx
  erebrus_speech:
    path: packages/erebrus_speech
  audioplayers: ^6.8.1
  # Native runtime is exact-pinned because its bundled whisper.cpp source is
  # part of the trusted execution path.
  whisper_ggml_plus: 1.5.2
  record: ^7.1.1
  erebrus_turboquant:
    path: third_party/erebrus_turboquant
  tray_manager: ^0.5.3
  window_manager: ^0.5.1

dependency_overrides:
  # Upstream 0.7.3 decodes each token independently and crashes when a UTF-8
  # scalar spans token pieces. This local patch buffers incomplete sequences.
  lib_llama_cpp:
    path: third_party/lib_llama_cpp
  # Official v0.7.3 Metal release asset, checksum and provenance are vendored
  # with the local platform package.
  lib_llama_cpp_macos:
    path: third_party/lib_llama_cpp_macos
  lib_llama_cpp_ios:
    path: third_party/lib_llama_cpp_ios
  # whisper_ggml_plus uses the current annotations package while the Solana
  # mobile client retains an unnecessarily narrow 2.x constraint. Both consume
  # only the stable annotation API; app-wide builds and wallet tests gate this.
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/erebrus-ai-icon-1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0A0A0C"
  adaptive_icon_background: "#0A0A0C"
  adaptive_icon_foreground: "assets/icons/erebrus-ai-icon-1024.png"
  macos:
    generate: true
    image_path: "assets/icons/erebrus-ai-icon-1024.png"
  windows:
    generate: true
    image_path: "assets/icons/erebrus-ai-icon-1024.png"
    icon_size: 256

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

  assets:
    - .env
    - assets/icons/erebrus-ai-icon-1024.png
    - assets/icons/tray/

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
